apiVersion: kubedb.com/v1alpha2
kind: Oracle
metadata:
  name: oracle-sample
  namespace: demo
spec:
  version: 21.3.0
  mode: DataGuard
  edition: enterprise
  replicas: 3
  
  # DataGuard Specific Configuration
  dataGuard:
    protectionMode: MaximumProtection
    standbyType: PHYSICAL
    syncMode: SYNC
    applyLagThreshold: 0
    transportLagThreshold: 0
    fastStartFailover:
      fastStartFailoverThreshold: 15
    observer:
      podTemplate:
        spec:
          imagePullSecrets:
            - name: orclcred
          containers:
          - name: observer
            resources:
              limits:
                cpu: "1"
                memory: 2Gi
              requests:
                cpu: 500m
                memory: 2Gi
      storage:
        resources:
          requests:
            storage: 1Gi
            
  # Storage Configuration
  storageType: Durable
  storage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
        
  # Pod Configuration
  podTemplate:
    spec:
      imagePullSecrets:
        - name: oraclecred
      securityContext:
        fsGroup: 54321
        runAsGroup: 54321
        runAsUser: 54321
      serviceAccountName: oracle-sample
      containers:
      - name: oracle
        resources:
          limits:
            cpu: "4"
            memory: 10Gi
          requests:
            cpu: "1500m"
            memory: 4Gi
      - name: oracle-coordinator
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 200m
            memory: 256Mi
  
  deletionPolicy: Delete